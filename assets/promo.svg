<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280"
  height="640" viewBox="0 0 1280 640">
  <!-- Render: rsvg-convert assets/promo.svg -o assets/promo.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff" />
      <stop offset="1" stop-color="#e6ecff" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" />
      <feOffset dy="16" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#6b5fd3" fill-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <circle cx="1080" cy="90" r="220" fill="#4f8ef7" fill-opacity="0.35" filter="url(#blur)" />
  <circle cx="820" cy="560" r="200" fill="#7c5cd6" fill-opacity="0.30" filter="url(#blur)" />
  <circle cx="90" cy="600" r="170" fill="#fbbf24" fill-opacity="0.30" filter="url(#blur)" />
  <rect width="1280" height="640" fill="url(#dots)" />

  <!-- Screenshots: dark behind, light in front, both bleeding off the edges -->
  <image xlink:href="app-screenshot-dark.png" x="720" y="48" width="600" height="497"
    filter="url(#shadow)" />
  <image xlink:href="app-screenshot-light.png" x="590" y="150" width="640" height="530"
    filter="url(#shadow)" />

  <!-- Left column -->
  <image xlink:href="icon.png" x="56" y="70" width="150" height="150" />
  <text font-family="Rubik" font-weight="700" font-size="62" fill="#1e1b2e" letter-spacing="-1">
    <tspan x="72" y="290">Desktop Files</tspan>
    <tspan x="72" y="360" fill="#6b4fd8">Editor</tspan>
  </text>
  <text font-family="Adwaita Sans" font-size="24" fill="#4a4660">
    <tspan x="72" y="418">Browse, edit and hide the apps</tspan>
    <tspan x="72" y="450">of your Linux launcher, in a few clicks.</tspan>
  </text>

  <!-- Flatpak -->
  <g font-family="Adwaita Sans" font-weight="600" font-size="18">
    <rect x="72" y="498" width="205" height="44" rx="22" fill="#1e1b2e" />
    <text x="175" y="526" fill="#ffffff" text-anchor="middle">Available as Flatpak</text>
  </g>
</svg>